<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>로그인 처리 중</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#6366f1,#06b6d4);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{width:100%;max-width:380px;background:rgba(255,255,255,.97);border-radius:28px;box-shadow:0 16px 40px rgba(0,0,0,.18);padding:28px;text-align:center}
    .logo{font-size:64px;line-height:1;margin-bottom:12px}
    .title{font-size:22px;font-weight:900}
    .sub{margin-top:10px;color:#64748b;font-size:13px;line-height:1.7}
    .error{margin-top:14px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px 14px;border-radius:16px;text-align:left;font-size:13px;line-height:1.6}
    .btn{margin-top:14px;border:none;border-radius:16px;padding:14px 16px;cursor:pointer;font-weight:800;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;width:100%}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚡</div>
    <div class="title">로그인 처리 중...</div>
    <div class="sub" id="statusText">세션을 확인하고 있어.</div>
    <div class="error" id="errorBox" style="display:none"></div>
    <button class="btn" id="retryBtn" style="display:none">처음으로 돌아가기</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL="https://ynjohdnpxeborztjhvpy.supabase.co";
    const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inluam9oZG5weGVib3J6dGpodnB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NTEzNjUsImV4cCI6MjA5MDEyNzM2NX0.2Qn4ZvP4tIetCWnZDRTqjY1CVKSmJ-VBm1X8Tb-cYnA";
    const HOME_URL=window.location.origin + "/";
    const statusText=document.getElementById("statusText");
    const errorBox=document.getElementById("errorBox");
    const retryBtn=document.getElementById("retryBtn");

    function showError(msg){
      statusText.textContent="로그인 완료를 마무리하지 못했어.";
      errorBox.style.display="block";
      errorBox.textContent=msg;
      retryBtn.style.display="block";
    }

    retryBtn.onclick=()=>{ window.location.href = HOME_URL; };

    async function wait(ms){ return new Promise(r=>setTimeout(r, ms)); }

    async function run(){
  try{
    if(SUPABASE_ANON_KEY==="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inluam9oZG5weGVib3J6dGpodnB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NTEzNjUsImV4cCI6MjA5MDEyNzM2NX0.2Qn4ZvP4tIetCWnZDRTqjY1CVKSmJ-VBm1X8Tb-cYnA"){
      showError("callback.html 안의 SUPABASE_ANON_KEY를 실제 anon public key로 바꿔줘.");
      return;
    }

    if(!window.supabase || typeof window.supabase.createClient!=="function"){
      showError("Supabase 라이브러리를 불러오지 못했어.");
      return;
    }

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:false,
        storageKey:"et_auth"
      }
    });

    statusText.textContent = "로그인 코드를 세션으로 바꾸는 중...";

    const url = new URL(window.location.href);
    const code = url.searchParams.get("code");

    if(!code){
      showError("URL에 code 값이 없어. Redirect URL이 정확한지 확인해줘.");
      return;
    }

    const { error } = await sb.auth.exchangeCodeForSession(code);
    if(error) throw error;

    await new Promise(r => setTimeout(r, 700));

    const { data: { session }, error: sessionError } = await sb.auth.getSession();
    if(sessionError) throw sessionError;

    if(session?.user){
      window.location.replace(HOME_URL);
      return;
    }

    showError("세션 저장까지 완료되지 않았어. Safari 사이트 데이터 삭제 후 다시 시도해줘.");
  }catch(e){
    console.error(e);
    showError(e?.message || "unknown error");
  }
}
  </script>
</body>
</html>
