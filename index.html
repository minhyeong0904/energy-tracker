<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>에너지 트래커</title>
  <style>
    :root{--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--primary:#6366f1;--primary2:#06b6d4;--shadow:0 8px 24px rgba(15,23,42,.08);--radius:20px}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh}
    button,input,textarea,select{font:inherit}
    .app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:92px}
    .hero{min-height:100vh;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;padding:24px}
    .hero-card{width:100%;max-width:380px;background:rgba(255,255,255,.97);border-radius:28px;box-shadow:0 16px 40px rgba(0,0,0,.18);padding:28px;text-align:center}
    .logo{font-size:64px;line-height:1;margin-bottom:12px}
    .title{font-size:24px;font-weight:900;letter-spacing:-.02em}
    .sub{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.6}
    .btn{border:none;border-radius:16px;padding:14px 16px;cursor:pointer;font-weight:800}
    .btn-primary{background:linear-gradient(135deg,var(--primary),#8b5cf6);color:#fff;box-shadow:0 10px 24px rgba(99,102,241,.24)}
    .btn-light{background:#fff;border:1.5px solid var(--line);color:#334155}
    .btn-ghost{background:transparent;border:1px solid var(--line);color:#64748b}
    .topbar{padding:20px 16px 12px}
    .toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .headline{font-size:22px;font-weight:900;letter-spacing:-.02em}
    .date{font-size:12px;color:#94a3b8;margin-top:4px}
    .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;max-width:100%;word-break:break-all}
    .status-idle{background:#f1f5f9;color:#64748b}.status-saving{background:#eff6ff;color:#2563eb}.status-saved{background:#ecfdf5;color:#059669}.status-local{background:#fffbeb;color:#b45309}.status-error{background:#fef2f2;color:#dc2626}
    .section{padding:0 16px 16px}
    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
    .energy-card{color:#fff;border-radius:24px;padding:22px;box-shadow:0 16px 32px rgba(99,102,241,.24);background:linear-gradient(135deg,#6366f1,#06b6d4)}
    .energy-level{font-size:36px;font-weight:900;letter-spacing:-.03em}
    .energy-emoji{font-size:46px;line-height:1;margin-bottom:6px}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .tag{background:rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;font-size:12px}
    .input-row{display:flex;gap:8px}
    .input,.mini-date{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;color:#0f172a;outline:none}
    .input:focus,.textarea:focus,.mini-date:focus{border-color:#a5b4fc;box-shadow:0 0 0 4px rgba(99,102,241,.12)}
    .textarea{width:100%;min-height:92px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;color:#0f172a;outline:none;resize:vertical;line-height:1.65}
    .list{display:flex;flex-direction:column;gap:10px}
    .task{background:#fff;border:1px solid #eef2f7;border-radius:18px;padding:14px 14px 12px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
    .task-top{display:flex;align-items:flex-start;gap:10px}
    .task-text{flex:1;font-size:14px;line-height:1.5;color:#1e293b;white-space:pre-wrap;word-break:break-word}
    .icon-btn{border:none;background:transparent;padding:0;cursor:pointer;line-height:1;font-size:20px}
    .task-meta{display:flex;flex-wrap:wrap;gap:8px;padding-left:30px;margin-top:10px}
    .mini{border-radius:999px;padding:6px 10px;border:1px solid var(--line);background:#f8fafc;color:#64748b;font-size:12px;font-weight:700;cursor:pointer}
    .mini.active-yes{background:#eff6ff;border-color:#bfdbfe;color:#2563eb}.mini.active-no{background:#fef2f2;border-color:#fecaca;color:#dc2626}.mini-date.active-date{background:#eff6ff;border-color:#c7d2fe;color:#4f46e5}
    .empty{color:#cbd5e1;text-align:center;padding:22px 0;font-size:14px}
    .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:rgba(255,255,255,.97);border-top:1px solid #eef2f7;display:flex;padding:10px 0 calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
    .nav button{flex:1;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:#94a3b8}
    .nav button.active{color:#6366f1;font-weight:800}
    .small{font-size:12px}.muted{color:#64748b}
    .row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .check-wrap{min-height:100vh;background:#0f172a;padding:32px 20px;color:#fff;display:flex;flex-direction:column}
    .progress{height:6px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:28px}
    .progress>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width .28s}
    .q-num{font-size:13px;color:#a5b4fc;font-weight:800;margin-bottom:8px}.q-emoji{font-size:54px;margin-bottom:14px}.q-title{font-size:24px;font-weight:900;line-height:1.4;letter-spacing:-.02em;margin-bottom:28px}
    .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .choice{border-radius:18px;border:2px solid rgba(255,255,255,.1);background:#111827;color:#e2e8f0;min-height:62px;font-size:20px;font-weight:900;cursor:pointer}
    .markers{display:flex;justify-content:space-between;color:#64748b;font-size:12px;margin-top:14px}
    .result-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#e0e7ff,#ecfeff)}
    .result-card{width:100%;max-width:380px;border-radius:28px;background:#fff;padding:28px;text-align:center;box-shadow:0 20px 40px rgba(15,23,42,.10)}
    .error-box{margin:16px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:14px 16px;border-radius:16px;line-height:1.65;font-size:13px}
    .hr{height:1px;background:#eef2f7;margin:14px 0}
    .seg{display:flex;gap:8px}.seg button{flex:1;padding:10px 0;border-radius:999px;border:none;cursor:pointer;font-weight:800;background:#e2e8f0;color:#64748b}.seg button.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
    .calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calendar-week{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
    .calendar-cell{aspect-ratio:1;border-radius:12px;border:2px solid transparent;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}.calendar-empty{aspect-ratio:1}
  </style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ynjohdnpxeborztjhvpy.supabase.co";
const SUPABASE_ANON_KEY="PASTE_YOUR_REAL_ANON_KEY_HERE";
const REDIRECT_URL=window.location.origin + "/auth/callback.html";
const TABLE_NAME="tracker_data";
const LOCAL_KEY="et_backup_v6";
const POST_LOGIN_FLAG="et_oauth_started";
const QUESTIONS=[
{id:"sleep_hours",label:"어젯밤 수면 시간은?",emoji:"🌙",min:1,max:10,markers:["1시간","5시간","10시간"]},
{id:"sleep_quality",label:"수면의 질은 어땠나요?",emoji:"💤",min:1,max:5,markers:["최악","보통","최고"]},
{id:"fatigue",label:"지금 얼마나 피곤한가요?",emoji:"😮‍💨",min:1,max:5,markers:["멀쩡함","보통","너무 피곤"]},
{id:"mood",label:"지금 기분은요?",emoji:"💭",min:1,max:5,markers:["😞","😐","😄"]},
{id:"motivation",label:"하고 싶은 의욕이 있나요?",emoji:"🔥",min:1,max:5,markers:["전혀","보통","충만"]},
{id:"stress",label:"스트레스 수준은?",emoji:"🌊",min:1,max:5,markers:["없음","보통","매우 높음"]},
];
const LEVELS=[
{level:"최저",emoji:"🪫",grad:["#f97316","#ef4444"],bg:"#fff1f2",tag:"#ef4444",activities:["멍때리기","스트레칭","짧은 낮잠","최소한만 하기"]},
{level:"낮음",emoji:"🔋",grad:["#f59e0b","#f97316"],bg:"#fffbeb",tag:"#f97316",activities:["루틴 업무","주변 정리","가벼운 집안일","간단 체크"]},
{level:"보통",emoji:"⚡",grad:["#6366f1","#8b5cf6"],bg:"#f5f3ff",tag:"#6366f1",activities:["집중 업무","자료 조사","운동","장보기"]},
{level:"높음",emoji:"🚀",grad:["#10b981","#06b6d4"],bg:"#ecfdf5",tag:"#10b981",activities:["중요한 업무","아이디어 정리","미뤄둔 일 처리","기획"]},
];
const S={sb:null,ready:false,user:null,data:{history:{},tasks:[]},memo:{},tab:"home",view:"main",step:0,answers:{},expandedDay:null,historyTab:"weekly",calendarYear:null,calendarMonth:null,statusType:"idle",statusText:"불러오는 중...",saveTimer:null,touchX:null,currentSaveReq:0,currentLoadReq:0};
const app=document.getElementById("app");
function todayKey(){return new Date().toISOString().slice(0,10);}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function setStatus(type,text){S.statusType=type;S.statusText=text;render();}
function saveLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify({data:S.data,memo:S.memo,savedAt:new Date().toISOString()}));return true;}catch(e){console.error(e);return false;}}
function loadLocal(){try{const raw=localStorage.getItem(LOCAL_KEY);return raw?JSON.parse(raw):null;}catch(e){console.error(e);return null;}}
function calcLevel(a){const {sleep_hours,sleep_quality,fatigue,mood,motivation,stress}=a;const s=((sleep_hours/10)*5+sleep_quality+(6-fatigue)+mood+motivation+(6-stress))/6;return s<=2?0:s<=3?1:s<=4?2:3;}
function matchColor(matched,total){if(!total)return null;const r=matched/total;if(r>=0.6)return {dot:"#3b82f6",bg:"#eff6ff",label:"잘 맞음"};if(r>=0.3)return {dot:"#eab308",bg:"#fefce8",label:"비슷"};return {dot:"#ef4444",bg:"#fef2f2",label:"안 맞음"};}
function getMatchStats(dateKey){const dt=S.data.tasks.filter(t=>(t.date||todayKey())===dateKey&&t.matched!==null);return {matched:dt.filter(t=>t.matched===true).length,total:dt.length};}
function timeoutPromise(ms,label){return new Promise((_,reject)=>setTimeout(()=>reject(new Error(label)),ms));}
function renderStatusOnly(){const el=document.getElementById("saveStatus");if(!el)return;el.className="pill status-"+S.statusType;el.textContent=S.statusText;}
async function dbLoad(userId){const req=++S.currentLoadReq;const query=S.sb.from(TABLE_NAME).select("data,memo").eq("user_id",userId).maybeSingle();const result=await Promise.race([query,timeoutPromise(8000,"load timeout")]);if(req!==S.currentLoadReq)throw new Error("stale load");if(result.error)throw result.error;return result.data||null;}
async function dbSave(){if(!S.user||!S.sb)return false;const localOk=saveLocal();const req=++S.currentSaveReq;try{const savePromise=S.sb.from(TABLE_NAME).upsert({user_id:S.user.id,data:S.data,memo:S.memo},{onConflict:"user_id"});const result=await Promise.race([savePromise,timeoutPromise(8000,"save timeout")]);if(req!==S.currentSaveReq)return false;if(result.error)throw result.error;S.statusType="saved";S.statusText=localOk?"서버 + 로컬에 저장됨":"서버에 저장됨";renderStatusOnly();return true;}catch(e){console.error("dbSave error",e);if(req!==S.currentSaveReq)return false;S.statusType=localOk?"local":"error";S.statusText=localOk?"서버 저장 실패 · "+(e?.message||"로컬 백업만 저장됨"):"저장 실패 · "+(e?.message||"");renderStatusOnly();return false;}}
function scheduleSave(){if(!S.ready)return;if(!S.user){saveLocal();S.statusType="local";S.statusText="로그인 전 · 로컬 임시 저장됨";renderStatusOnly();return;}S.statusType="saving";S.statusText="저장 중...";renderStatusOnly();clearTimeout(S.saveTimer);S.saveTimer=setTimeout(()=>{dbSave();},450);}
async function loadUserData(userId){const backup=loadLocal();try{S.statusType="saving";S.statusText="불러오는 중...";renderStatusOnly();const saved=await dbLoad(userId);if(saved){S.data=saved.data||{history:{},tasks:[]};S.memo=saved.memo||{};setStatus("saved","서버 데이터 불러옴");}else if(backup){S.data=backup.data||{history:{},tasks:[]};S.memo=backup.memo||{};setStatus("local","로컬 백업 복원됨");}else{S.data={history:{},tasks:[]};S.memo={};setStatus("idle","새 계정으로 시작");}}catch(e){console.error("dbLoad error",e);if(backup){S.data=backup.data||{history:{},tasks:[]};S.memo=backup.memo||{};setStatus("local","서버 불러오기 실패 · "+(e?.message||"로컬 백업 복원"));}else{S.data={history:{},tasks:[]};S.memo={};setStatus("error","서버 불러오기 실패 · "+(e?.message||""));}}}
async function signInWithGoogle(){if(!S.sb)return;try{sessionStorage.setItem(POST_LOGIN_FLAG,"1");const {error}=await S.sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:REDIRECT_URL,skipBrowserRedirect:false}});if(error)throw error;}catch(e){console.error(e);showFatalBox("구글 로그인 중 오류가 났어. Redirect URL, Site URL, Google 설정을 다시 확인해줘.");}}
async function signOut(){try{if(S.sb)await S.sb.auth.signOut();}catch(e){console.error(e);}S.user=null;S.data={history:{},tasks:[]};S.memo={};S.statusType="idle";S.statusText="로그인 필요";render();}
function addTask(){const input=document.getElementById("newTaskInput");if(!input)return;const text=input.value.trim();if(!text)return;S.data.tasks.unshift({id:Date.now(),text,urgent:false,matched:null,date:todayKey()});input.value="";scheduleSave();render();}
function toggleUrgent(id){S.data.tasks=S.data.tasks.map(t=>t.id===id?{...t,urgent:!t.urgent}:t).sort((a,b)=>Number(b.urgent)-Number(a.urgent));scheduleSave();render();}
function deleteTask(id){S.data.tasks=S.data.tasks.filter(t=>t.id!==id);scheduleSave();render();}
function setTaskDate(id,date){S.data.tasks=S.data.tasks.map(t=>t.id===id?{...t,date}:t);scheduleSave();render();}
function setMatched(id,val){S.data.tasks=S.data.tasks.map(t=>t.id===id?{...t,matched:t.matched===val?null:val}:t);scheduleSave();render();}
function updateMemo(text){S.memo[todayKey()]=text;scheduleSave();renderStatusOnly();}
function answerQuestion(val){const q=QUESTIONS[S.step];S.answers[q.id]=val;if(S.step<QUESTIONS.length-1){S.step+=1;}else{const li=calcLevel(S.answers);S.data.history[todayKey()]={answers:{...S.answers},level:li,time:new Date().toISOString()};S.view="result";scheduleSave();}render();}
function restartCheck(){S.step=0;S.answers={};S.view="check";render();}
function statusPill(){return `<span id="saveStatus" class="pill status-${S.statusType}">${escapeHtml(S.statusText)}</span>`;}
function renderLogin(){app.innerHTML=`<div class="hero"><div class="hero-card"><div class="logo">⚡</div><div class="title">에너지 트래커</div><div class="sub">Google 로그인 후 다시 로그인 화면으로 돌아오면<br>callback 파일 경로와 Redirect URLs부터 확인해.</div><div style="height:18px"></div><button class="btn btn-light" id="googleLoginBtn" style="width:100%">Google로 로그인</button><div style="height:12px"></div><div class="small muted">콜백 파일은 /auth/callback.html 에 있어야 해.</div></div></div>`;document.getElementById("googleLoginBtn").onclick=signInWithGoogle;}
function renderCheck(){const q=QUESTIONS[S.step];const values=Array.from({length:q.max-q.min+1},(_,i)=>i+q.min);app.innerHTML=`<div class="check-wrap"><div class="progress"><div style="width:${((S.step+1)/QUESTIONS.length)*100}%"></div></div><div class="q-num">${S.step+1} / ${QUESTIONS.length}</div><div class="q-emoji">${q.emoji}</div><div class="q-title">${escapeHtml(q.label)}</div><div class="choices">${values.map(v=>`<button class="choice" data-v="${v}">${v}</button>`).join("")}</div><div class="markers">${q.markers.map(m=>`<span>${escapeHtml(m)}</span>`).join("")}</div><div style="margin-top:auto;padding-top:28px" class="row-between"><button class="btn btn-ghost" id="prevBtn">${S.step>0?"← 이전":"← 홈으로"}</button><div class="small muted">좌우 스와이프 가능</div></div></div>`;document.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>answerQuestion(Number(btn.dataset.v)));document.getElementById("prevBtn").onclick=()=>{if(S.step>0)S.step-=1;else S.view="main";render();};const wrap=document.querySelector(".check-wrap");wrap.ontouchstart=e=>{S.touchX=e.touches[0].clientX;};wrap.ontouchend=e=>{if(S.touchX==null)return;const dx=e.changedTouches[0].clientX-S.touchX;if(dx<=-60&&S.step<QUESTIONS.length-1){S.step+=1;render();}else if(dx>=60&&S.step>0){S.step-=1;render();}S.touchX=null;};}
function renderResult(){const rec=S.data.history[todayKey()];const l=LEVELS[rec.level];app.innerHTML=`<div class="result-wrap"><div class="result-card"><div style="font-size:72px;line-height:1">${l.emoji}</div><div class="small muted" style="margin-top:10px">오늘의 에너지</div><div style="font-size:40px;font-weight:900;letter-spacing:-.03em;margin-top:4px;background:linear-gradient(135deg,${l.grad[0]},${l.grad[1]});-webkit-background-clip:text;-webkit-text-fill-color:transparent">${l.level}</div><div class="card" style="margin-top:18px;background:${l.bg};box-shadow:none"><div class="small muted">추천 활동</div><div class="tags" style="justify-content:center">${l.activities.map(a=>`<span class="tag" style="background:#fff;color:${l.tag}">${escapeHtml(a)}</span>`).join("")}</div></div><div style="height:12px"></div><button class="btn btn-primary" id="goTasksBtn" style="width:100%">할 일 체크하러 가기 →</button><div style="height:10px"></div><button class="btn btn-ghost" id="goHomeBtn" style="width:100%">홈으로</button></div></div>`;document.getElementById("goTasksBtn").onclick=()=>{S.view="main";S.tab="tasks";render();};document.getElementById("goHomeBtn").onclick=()=>{S.view="main";S.tab="home";render();};}
function renderHome(){const today=todayKey();const rec=S.data.history[today];const lvl=rec?LEVELS[rec.level]:null;const stats=getMatchStats(today);const mc=matchColor(stats.matched,stats.total);const previewTasks=S.data.tasks.slice(0,3);return `<div class="topbar"><div class="toprow"><div><div class="headline">⚡ 에너지 트래커</div><div class="date">${today}</div></div><button class="btn btn-ghost small" id="logoutBtn">로그아웃</button></div><div style="margin-top:12px">${statusPill()}</div></div><div class="section"><div class="energy-card" style="${lvl?`background:linear-gradient(135deg,${lvl.grad[0]},${lvl.grad[1]})`:''}">${lvl?`<div class="energy-emoji">${lvl.emoji}</div><div class="small" style="opacity:.86">오늘의 에너지</div><div class="energy-level">${lvl.level}</div><div class="tags">${lvl.activities.map(a=>`<span class="tag">${escapeHtml(a)}</span>`).join("")}</div><div style="height:14px"></div><button class="btn" id="recheckBtn" style="background:rgba(255,255,255,.22);color:#fff;width:auto">다시 체크</button>`:`<div style="text-align:center;padding:6px 0 2px"><div class="energy-emoji">🔍</div><div style="font-size:16px;font-weight:800">오늘 에너지 체크 안 했어</div><div style="height:14px"></div><button class="btn" id="startCheckBtn" style="background:#fff;color:#4f46e5">지금 체크하기 →</button></div>`}</div></div>${mc?`<div class="section"><div class="card" style="background:${mc.bg};box-shadow:none"><div class="row-between"><div class="small" style="color:#475569">오늘 할 일 <b>${stats.total}개</b> 중 <b>${stats.matched}개</b>가 에너지에 맞아</div><div class="pill" style="background:#fff;color:${mc.dot}">${mc.label}</div></div></div></div>`:''}<div class="section"><div class="card"><div class="row-between"><div style="font-size:15px;font-weight:800">할 일 ${S.data.tasks.length?`<span style="color:#6366f1">${S.data.tasks.length}</span>`:''}</div><button class="btn btn-ghost small" id="goTasksFromHome">전체보기 →</button></div><div class="hr"></div>${previewTasks.length?previewTasks.map(t=>`<div class="row-between" style="padding:8px 0;border-bottom:1px solid #f1f5f9"><div style="display:flex;align-items:center;gap:8px;min-width:0"><span>${t.urgent?"⭐":"⚪"}</span><div style="font-size:14px;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px">${escapeHtml(t.text)}</div></div><div class="small" style="font-weight:800;color:${t.matched===true?'#2563eb':t.matched===false?'#dc2626':'#94a3b8'}">${t.matched===true?"👌 딱좋아":t.matched===false?"🙅 무리야":""}</div></div>`).join(''):`<div class="empty">할 일을 추가해봐</div>`}</div></div><div class="section"><div class="card"><div style="font-size:15px;font-weight:800;margin-bottom:10px">📝 오늘의 메모</div><textarea id="memoInput" class="textarea" placeholder="오늘 하루 짧게 기록해봐">${escapeHtml(S.memo[today]||"")}</textarea></div></div>`;}
function renderTaskItem(t){const isToday=(t.date||todayKey())===todayKey();return `<div class="task"><div class="task-top"><button class="icon-btn urgent-btn" data-id="${t.id}">${t.urgent?"⭐":"⚪"}</button><div class="task-text">${escapeHtml(t.text)}</div><button class="icon-btn delete-btn" data-id="${t.id}" style="color:#cbd5e1">×</button></div><div class="task-meta"><input type="date" class="mini-date ${isToday?'active-date':''}" data-id="${t.id}" value="${escapeHtml(t.date||todayKey())}"><button class="mini ${t.matched===true?"active-yes":""}" data-match="yes" data-id="${t.id}">👌 딱좋아</button><button class="mini ${t.matched===false?"active-no":""}" data-match="no" data-id="${t.id}">🙅 무리야</button></div></div>`;}
function renderTasks(){return `<div class="topbar"><div class="headline">📋 할 일</div><div style="margin-top:12px">${statusPill()}</div></div><div class="section"><div class="input-row"><input id="newTaskInput" class="input" placeholder="할 일 추가..." /><button class="btn btn-primary" id="addTaskBtn" style="padding-inline:18px">+</button></div></div><div class="section"><div class="list">${S.data.tasks.length?S.data.tasks.map(renderTaskItem).join(''):`<div class="empty">아직 할 일이 없어</div>`}</div></div>`;}
function renderDayDetail(k){const stats=getMatchStats(k);const mc=matchColor(stats.matched,stats.total);const dayTasks=S.data.tasks.filter(t=>(t.date||todayKey())===k);const memo=S.memo[k]||"";return `<div class="card" style="margin-top:2px;background:${mc?mc.bg:'#fff'}"><div class="small muted">할 일</div><div style="height:8px"></div>${dayTasks.length?dayTasks.map(t=>`<div class="row-between" style="padding:8px 0;border-bottom:1px solid #f1f5f9"><div style="display:flex;align-items:center;gap:8px;min-width:0"><span>${t.urgent?"⭐":"⚪"}</span><div style="font-size:14px;color:#334155">${escapeHtml(t.text)}</div></div><div class="small" style="font-weight:800;color:${t.matched===true?'#2563eb':t.matched===false?'#dc2626':'#94a3b8'}">${t.matched===true?"👌":t.matched===false?"🙅":""}</div></div>`).join(''):`<div class="small" style="color:#cbd5e1">할 일 없음</div>`}<div class="hr"></div><div class="small muted">메모</div><div style="margin-top:8px;line-height:1.65;color:#475569">${memo?"📝 "+escapeHtml(memo):`<span style="color:#cbd5e1">메모 없음</span>`}</div></div>`;}
function renderWeeklyHistory(){const histKeys=Object.keys(S.data.history).sort().reverse();return histKeys.slice(0,7).map(k=>{const r=S.data.history[k];const l=LEVELS[r.level];const stats=getMatchStats(k);const mc=matchColor(stats.matched,stats.total);const expanded=S.expandedDay===k;return `<div style="margin-bottom:10px"><button class="card hist-toggle" data-date="${k}" style="width:100%;text-align:left;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(15,23,42,.04);padding:14px 16px;background:${mc?mc.dot+'14':'#fff'}"><div class="row-between"><div style="display:flex;align-items:center;gap:10px"><div style="font-size:22px">${l.emoji}</div><div><div class="small muted">${k}</div><div style="font-weight:900;color:${l.tag}">${l.level}</div></div></div><div style="display:flex;align-items:center;gap:8px">${mc?`<div class="pill" style="background:#fff;color:${mc.dot}">${mc.label}</div>`:''}<div class="small muted">${expanded?"▲":"▼"}</div></div></div></button>${expanded?renderDayDetail(k):''}</div>`;}).join('')||`<div class="empty">기록이 아직 없어</div>`;}
function renderMonthlyHistory(){const now=new Date();if(S.calendarYear==null){S.calendarYear=now.getFullYear();S.calendarMonth=now.getMonth();}const firstDay=new Date(S.calendarYear,S.calendarMonth,1).getDay();const daysInMonth=new Date(S.calendarYear,S.calendarMonth+1,0).getDate();let cells='';for(let i=0;i<firstDay;i++)cells+='<div class="calendar-empty"></div>';for(let d=1;d<=daysInMonth;d++){const k=`${S.calendarYear}-${String(S.calendarMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const rec=S.data.history[k];const l=rec?LEVELS[rec.level]:null;const stats=getMatchStats(k);const mc=matchColor(stats.matched,stats.total);const isToday=k===todayKey();const isSel=S.expandedDay===k;const bg=mc?mc.dot+'22':l?`linear-gradient(135deg,${l.grad[0]}22,${l.grad[1]}11)`:'#f8fafc';const border=isSel?'2px solid #6366f1':isToday?'2px solid #c7d2fe':mc?`2px solid ${mc.dot}55`:'2px solid transparent';cells+=`<button class="calendar-cell month-cell" data-date="${k}" style="background:${bg};border:${border}"><span style="font-size:11px;font-weight:${isToday?800:500};color:${isToday?'#6366f1':'#334155'}">${d}</span>${l?`<span style="font-size:13px">${l.emoji}</span>`:''}</button>`;}return `<div class="card"><div class="calendar-head"><button class="btn btn-ghost small" id="monthPrev">‹</button><div style="font-weight:800">${S.calendarYear}년 ${S.calendarMonth+1}월</div><button class="btn btn-ghost small" id="monthNext">›</button></div><div class="calendar-week">${["일","월","화","수","목","금","토"].map(d=>`<div style="text-align:center;font-size:11px;color:#94a3b8;font-weight:700;padding:4px 0">${d}</div>`).join('')}</div><div class="calendar-grid">${cells}</div></div>${S.expandedDay&&S.data.history[S.expandedDay]?`<div style="margin-top:12px">${renderDayDetail(S.expandedDay)}</div>`:''}`;}
function renderHistory(){return `<div class="topbar"><div class="headline">📅 기록</div><div style="margin-top:12px">${statusPill()}</div></div><div class="section"><div class="seg"><button id="weeklyTab" class="${S.historyTab==='weekly'?'active':''}">최근 7일</button><button id="monthlyTab" class="${S.historyTab==='monthly'?'active':''}">월별</button></div></div><div class="section">${S.historyTab==='weekly'?renderWeeklyHistory():renderMonthlyHistory()}</div>`;}
function renderMain(){app.innerHTML=`<div class="app">${S.tab==="home"?renderHome():S.tab==="tasks"?renderTasks():renderHistory()}</div><nav class="nav"><button class="${S.tab==='home'?'active':''}" data-tab="home"><div style="font-size:22px">🏠</div><div class="small">홈</div></button><button class="${S.tab==='tasks'?'active':''}" data-tab="tasks"><div style="font-size:22px">📋</div><div class="small">할 일</div></button><button class="${S.tab==='history'?'active':''}" data-tab="history"><div style="font-size:22px">📅</div><div class="small">기록</div></button></nav>`;document.querySelectorAll(".nav button").forEach(btn=>btn.onclick=()=>{S.tab=btn.dataset.tab;render();});const logoutBtn=document.getElementById("logoutBtn");if(logoutBtn)logoutBtn.onclick=signOut;const goTasksFromHome=document.getElementById("goTasksFromHome");if(goTasksFromHome)goTasksFromHome.onclick=()=>{S.tab="tasks";render();};const startCheckBtn=document.getElementById("startCheckBtn");if(startCheckBtn)startCheckBtn.onclick=restartCheck;const recheckBtn=document.getElementById("recheckBtn");if(recheckBtn)recheckBtn.onclick=restartCheck;const memoInput=document.getElementById("memoInput");if(memoInput)memoInput.oninput=e=>updateMemo(e.target.value);const addTaskBtn=document.getElementById("addTaskBtn");if(addTaskBtn)addTaskBtn.onclick=addTask;const newTaskInput=document.getElementById("newTaskInput");if(newTaskInput)newTaskInput.onkeydown=e=>{if(e.key==="Enter")addTask();};document.querySelectorAll(".urgent-btn").forEach(btn=>btn.onclick=()=>toggleUrgent(Number(btn.dataset.id)));document.querySelectorAll(".delete-btn").forEach(btn=>btn.onclick=()=>deleteTask(Number(btn.dataset.id)));document.querySelectorAll('[data-match="yes"]').forEach(btn=>btn.onclick=()=>setMatched(Number(btn.dataset.id),true));document.querySelectorAll('[data-match="no"]').forEach(btn=>btn.onclick=()=>setMatched(Number(btn.dataset.id),false));document.querySelectorAll(".mini-date").forEach(input=>input.onchange=()=>setTaskDate(Number(input.dataset.id),input.value));document.querySelectorAll(".hist-toggle").forEach(btn=>btn.onclick=()=>{S.expandedDay=S.expandedDay===btn.dataset.date?null:btn.dataset.date;render();});const weeklyTab=document.getElementById("weeklyTab");if(weeklyTab)weeklyTab.onclick=()=>{S.historyTab='weekly';S.expandedDay=null;render();};const monthlyTab=document.getElementById("monthlyTab");if(monthlyTab)monthlyTab.onclick=()=>{S.historyTab='monthly';render();};const monthPrev=document.getElementById("monthPrev");if(monthPrev)monthPrev.onclick=()=>{if(S.calendarMonth===0){S.calendarYear-=1;S.calendarMonth=11;}else S.calendarMonth-=1;S.expandedDay=null;render();};const monthNext=document.getElementById("monthNext");if(monthNext)monthNext.onclick=()=>{if(S.calendarMonth===11){S.calendarYear+=1;S.calendarMonth=0;}else S.calendarMonth+=1;S.expandedDay=null;render();};document.querySelectorAll(".month-cell").forEach(btn=>btn.onclick=()=>{S.expandedDay=S.expandedDay===btn.dataset.date?null:btn.dataset.date;render();});}
function showFatalBox(message){app.innerHTML=`<div class="hero"><div class="hero-card" style="text-align:left"><div style="font-size:56px;line-height:1;margin-bottom:12px;text-align:center">⚠️</div><div class="title" style="text-align:center;font-size:22px">앱 실행 오류</div><div class="error-box" style="margin:18px 0 0">${escapeHtml(message)}</div><div style="height:14px"></div><button class="btn btn-primary" id="reloadBtn" style="width:100%">새로고침</button></div></div>`;document.getElementById("reloadBtn").onclick=()=>location.reload();}
function render(){if(!S.ready){app.innerHTML=`<div class="hero"><div class="hero-card"><div class="logo">⚡</div><div class="title">불러오는 중...</div><div class="sub" style="margin-top:10px">callback 처리 후 세션을 확인하는 중이야.</div></div></div>`;return;}if(!S.user){renderLogin();return;}if(S.view==="check")return renderCheck();if(S.view==="result")return renderResult();renderMain();}
async function init(){try{if(SUPABASE_ANON_KEY==="PASTE_YOUR_REAL_ANON_KEY_HERE"){showFatalBox("index.html 안의 SUPABASE_ANON_KEY를 실제 anon public key로 바꿔줘.");return;}if(!window.supabase||typeof window.supabase.createClient!=="function"){showFatalBox("Supabase 라이브러리를 불러오지 못했어.");return;}S.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"et_auth"}});const backup=loadLocal();if(backup){S.data=backup.data||{history:{},tasks:[]};S.memo=backup.memo||{};}const sessionResult=await Promise.race([S.sb.auth.getSession(),timeoutPromise(8000,"session timeout")]);const {data:{session},error}=sessionResult;if(error)throw error;S.user=session?.user||null;if(S.user){sessionStorage.removeItem(POST_LOGIN_FLAG);await loadUserData(S.user.id);}else if(sessionStorage.getItem(POST_LOGIN_FLAG)==="1"){setStatus("error","로그인 세션을 못 불러옴 · callback.html 경로/Redirect URLs 확인");}else if(backup){setStatus("local","로그인 전 · 로컬 백업 존재");}else{setStatus("idle","로그인 필요");}S.ready=true;render();}catch(e){console.error(e);S.ready=true;const backup=loadLocal();if(backup){S.data=backup.data||{history:{},tasks:[]};S.memo=backup.memo||{};S.statusType="local";S.statusText="초기화 실패 · "+(e?.message||"로컬 백업 복원");render();}else showFatalBox("초기화 실패 · "+(e?.message||"unknown"));}}
init();
</script>
</body>
</html>
