<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>에너지 트래커</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:linear-gradient(135deg,#6366f1,#06b6d4);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .card{
      width:100%;
      max-width:380px;
      background:rgba(255,255,255,.97);
      border-radius:28px;
      box-shadow:0 16px 40px rgba(0,0,0,.18);
      padding:28px;
      text-align:center;
    }
    .logo{font-size:64px;line-height:1;margin-bottom:12px}
    .title{font-size:24px;font-weight:900}
    .sub{margin-top:8px;color:#64748b;font-size:13px;line-height:1.7}
    .btn{
      margin-top:18px;
      border:none;
      border-radius:16px;
      padding:14px 16px;
      cursor:pointer;
      font-weight:800;
      background:#fff;
      border:1.5px solid #e2e8f0;
      color:#334155;
      width:100%;
    }
    .error{
      margin-top:14px;
      background:#fff7ed;
      border:1px solid #fed7aa;
      color:#9a3412;
      padding:12px 14px;
      border-radius:16px;
      text-align:left;
      font-size:13px;
      line-height:1.6;
      display:none;
      word-break:break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚡</div>
    <div class="title">에너지 트래커</div>
    <div class="sub">구글 로그인 후 callback 페이지를 거쳐 홈으로 돌아와.</div>
    <button class="btn" id="loginBtn">Google로 로그인</button>
    <div class="error" id="errorBox"></div>
  </div>

  <script src="./config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const CFG = window.ET_CONFIG || {};
    const errorBox = document.getElementById("errorBox");

    function showError(msg){
      errorBox.style.display = "block";
      errorBox.textContent = msg;
    }

    if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || CFG.SUPABASE_ANON_KEY.includes("여기에_네_anon_public_key_넣기")) {
      showError("config.js에서 SUPABASE_ANON_KEY를 실제 anon public key로 바꿔줘.");
    } else if (!window.supabase || typeof window.supabase.createClient !== "function") {
      showError("Supabase 라이브러리를 불러오지 못했어.");
    } else {
      const sb = window.supabase.createClient(
        CFG.SUPABASE_URL,
        CFG.SUPABASE_ANON_KEY,
        {
          auth: {
            flowType: "pkce",
            detectSessionInUrl: false,
            persistSession: true,
            autoRefreshToken: true,
            storageKey: "et_auth"
          }
        }
      );

      document.getElementById("loginBtn").onclick = async () => {
        try {
          const { error } = await sb.auth.signInWithOAuth({
            provider: "google",
            options: {
              redirectTo: window.location.origin + "/auth/callback.html"
            }
          });

          if (error) throw error;
        } catch (e) {
          console.error(e);
          showError("로그인 시작 실패: " + (e?.message || "unknown error"));
        }
      };
    }
  </script>
</body>
</html>
