
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>에너지 트래커</title>
<style>
  :root{
    --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
    --primary:#6366f1; --primary2:#06b6d4; --danger:#ef4444; --ok:#10b981; --warn:#f59e0b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
  body{max-width:480px;margin:0 auto;min-height:100vh}
  button,input,textarea,select{font:inherit}
  .hidden{display:none !important}
  .screen{min-height:100vh;padding:20px 16px 96px}
  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .loading{
    background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:flex;flex-direction:column;gap:12px;
  }
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  .hero{background:linear-gradient(135deg,var(--primary),#8b5cf6);color:#fff;padding:24px;border:none;box-shadow:0 10px 24px rgba(99,102,241,.28)}
  .title{font-size:22px;font-weight:800}
  .sub{font-size:13px;color:#94a3b8}
  .btn{border:none;border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer}
  .btn-primary{background:linear-gradient(135deg,var(--primary),#8b5cf6);color:#fff}
  .btn-secondary{background:#fff;border:1.5px solid var(--border);color:#334155}
  .btn-ghost{background:none;border:1px solid var(--border);color:#64748b}
  .row{display:flex;align-items:center}
  .between{display:flex;align-items:center;justify-content:space-between}
  .gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap16{gap:16px}
  .mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}.mb24{margin-bottom:24px}
  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
  .task{padding:14px 16px;border-radius:16px;background:#fff;border:1px solid var(--border);box-shadow:0 1px 6px rgba(0,0,0,.04)}
  .input,.textarea{width:100%;border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;outline:none;background:#fff}
  .textarea{min-height:88px;resize:none;line-height:1.6}
  .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:#fff;border-top:1px solid #edf2f7;display:flex;padding:10px 0 20px;z-index:10}
  .nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:#94a3b8}
  .nav button.active{color:var(--primary);font-weight:700}
  .status{font-size:12px;border-radius:999px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px}
  .status.ok{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0}
  .status.warn{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
  .status.err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
  .status.info{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}
  .badge{background:#f1f5f9;color:#64748b;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
  .q-choices{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .qbtn{height:56px;border-radius:18px;border:2px solid #2a2a3e;background:#1a1a2e;color:#e2e8f0;font-size:20px;font-weight:800}
  .progress{height:4px;background:#1e1e2e;border-radius:6px;overflow:hidden}
  .progress>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2))}
  .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .daybtn{aspect-ratio:1;border-radius:12px;border:2px solid transparent;background:#f8fafc}
  .small{font-size:12px}
  .tiny{font-size:11px}
  .error-box{background:#fff;border:1px solid #fecaca;border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
</style>
<script>
window.__bootErrors = [];
window.addEventListener('error', function(e){
  try { window.__bootErrors.push((e && e.message) ? e.message : 'unknown error'); } catch(_) {}
});
</script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app" class="center-screen loading">
  <div style="font-size:48px">⚡</div>
  <div style="font-size:14px;font-weight:700">불러오는 중...</div>
  <div style="font-size:12px;opacity:.85">초기화 중</div>
</div>

<script>
(function(){
  "use strict";

  // ===== 설정 =====
  const SUPABASE_URL = "https://ynjohdnpxeborztjhvpy.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inluam9oZG5weGVib3J6dGpodnB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NTEzNjUsImV4cCI6MjA5MDEyNzM2NX0.2Qn4ZvP4tIetCWnZDRTqjY1CVKSmJ-VBm1X8Tb-cYnA";
  const REDIRECT_URL = "https://energy-tracker-lac.vercel.app";
  const TABLE_NAME = "tracker_data";
  const STORAGE_KEY = "et_local_backup_v1";
  const SAVE_DEBOUNCE_MS = 700;

  const QUESTIONS = [
    {id:"sleep_hours",label:"어젯밤 수면 시간은?",emoji:"🌙",min:1,max:10,markers:["1시간","5시간","10시간"]},
    {id:"sleep_quality",label:"수면의 질은 어땠나요?",emoji:"💤",min:1,max:5,markers:["최악","보통","최고"]},
    {id:"fatigue",label:"지금 얼마나 피곤한가요?",emoji:"😮‍💨",min:1,max:5,markers:["멀쩡함","보통","너무 피곤"]},
    {id:"mood",label:"지금 기분은요?",emoji:"💭",min:1,max:5,markers:["😞","😐","😄"]},
    {id:"motivation",label:"하고 싶은 의욕이 있나요?",emoji:"🔥",min:1,max:5,markers:["전혀","보통","충만"]},
    {id:"stress",label:"스트레스 수준은?",emoji:"🌊",min:1,max:5,markers:["없음","보통","매우 높음"]},
  ];

  const LEVELS = [
    {level:"최저",emoji:"🪫",grad:["#f97316","#ef4444"],bg:"#fff1f0",tag:"#ef4444",activities:["멍때리기","스트레칭","짧은 낮잠","아무것도 안하기"]},
    {level:"낮음",emoji:"🔋",grad:["#f59e0b","#f97316"],bg:"#fffbeb",tag:"#f97316",activities:["루틴 업무","주변 정리","제자리 정리","가벼운 집안일"]},
    {level:"보통",emoji:"⚡",grad:["#6366f1","#8b5cf6"],bg:"#f5f3ff",tag:"#6366f1",activities:["집중 업무","자료 조사","운동","장보기","정리"]},
    {level:"높음",emoji:"🚀",grad:["#10b981","#06b6d4"],bg:"#ecfdf5",tag:"#10b981",activities:["중요한 업무","아이디어 정리","운동","기획","미해결 과제"]},
  ];

  const app = document.getElementById('app');
  let supabase = null;
  let saveTimer = null;
  let state = {
    ready: false,
    bootTimedOut: false,
    user: null,
    data: { history: {}, tasks: [] },
    memo: {},
    view: 'main', // main | check | result
    step: 0,
    answers: {},
    tab: 'home', // home | tasks | history
    historyTab: 'weekly',
    selectedMonth: { year: new Date().getFullYear(), month: new Date().getMonth() },
    selectedDay: null,
    saving: 'idle', // idle | local | saving | saved | local_only | error
    saveMessage: '아직 저장 전',
    lastError: ''
  };

  const h = (strings, ...values) => strings.reduce((a, s, i) => a + s + (values[i] ?? ''), '');

  function esc(v){
    return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function todayKey(){
    return new Date().toISOString().slice(0,10);
  }

  function calcLevel(a){
    const {sleep_hours,sleep_quality,fatigue,mood,motivation,stress} = a;
    const s = ((sleep_hours/10)*5 + sleep_quality + (6-fatigue) + mood + motivation + (6-stress)) / 6;
    return s<=2?0:s<=3?1:s<=4?2:3;
  }

  function matchColor(matched, total){
    if (!total) return null;
    const r = matched / total;
    if (r >= 0.6) return {dot:"#3b82f6", bg:"#eff6ff", label:"잘 맞음"};
    if (r >= 0.3) return {dot:"#eab308", bg:"#fefce8", label:"비슷"};
    return {dot:"#ef4444", bg:"#fef2f2", label:"안 맞음"};
  }

  function clone(obj){ return JSON.parse(JSON.stringify(obj)); }

  function getLocalBackup(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return null;
      return parsed;
    } catch (e) {
      return null;
    }
  }

  function writeLocalBackup(reason){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        savedAt: new Date().toISOString(),
        reason,
        data: state.data,
        memo: state.memo
      }));
      state.saving = 'local';
      state.saveMessage = '로컬 백업 저장됨';
      return true;
    } catch (e) {
      state.lastError = 'localStorage 저장 실패: ' + (e && e.message ? e.message : e);
      return false;
    }
  }

  function setSaveStatus(kind, msg){
    state.saving = kind;
    state.saveMessage = msg;
    render();
  }

  function patch(next){
    state = Object.assign({}, state, next);
    render();
  }

  function patchData(mutator){
    const nextData = clone(state.data);
    const nextMemo = clone(state.memo);
    mutator(nextData, nextMemo);
    state.data = nextData;
    state.memo = nextMemo;
    writeLocalBackup('local-change');
    scheduleSave();
    render();
  }

  function saveStatusBadge(){
    const map = {
      idle: ['info', '저장 대기'],
      local: ['warn', state.saveMessage || '로컬 백업 저장됨'],
      saving: ['info', '저장 중...'],
      saved: ['ok', state.saveMessage || '서버 + 로컬 저장됨'],
      local_only: ['warn', state.saveMessage || '서버 저장 실패 · 로컬만 저장됨'],
      error: ['err', state.saveMessage || '오류']
    };
    const [cls, text] = map[state.saving] || ['info', '상태 확인'];
    return `<span class="status ${cls}">${esc(text)}</span>`;
  }

  function bootErrorHTML(title, detail){
    app.className = 'center-screen';
    app.innerHTML = h`
      <div class="error-box" style="width:100%;max-width:420px">
        <div style="font-size:40px;margin-bottom:10px">⚠️</div>
        <div style="font-size:18px;font-weight:800;margin-bottom:8px">${esc(title)}</div>
        <div style="font-size:14px;color:#475569;line-height:1.6;margin-bottom:14px">${esc(detail)}</div>
        <div class="mono small" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px">가능한 원인
- 외부 스크립트 로딩 실패
- Supabase 키 미입력
- 네트워크 차단 / 콘텐츠 차단
- 배포 주소와 Redirect URL 불일치</div>
      </div>`;
  }

  function ensureDeps(){
    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
      bootErrorHTML(
        'Supabase 라이브러리를 불러오지 못했어',
        'iPhone Safari에서 외부 CDN이 막히거나 네트워크가 불안정하면 이런 일이 생겨. 광고/콘텐츠 차단기, 사설 DNS, 사내/공공 와이파이에서도 자주 생겨.'
      );
      return false;
    }
    if (!SUPABASE_URL || !/^https:\/\/.+\.supabase\.co$/.test(SUPABASE_URL)) {
      bootErrorHTML('SUPABASE_URL 설정이 잘못됐어', '코드 상단의 SUPABASE_URL을 다시 확인해줘.');
      return false;
    }
    if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === 'REPLACE_WITH_YOUR_ANON_KEY' || SUPABASE_ANON_KEY.includes('<SECRET>')) {
      bootErrorHTML('SUPABASE_ANON_KEY가 비어 있어', '코드 상단의 SUPABASE_ANON_KEY를 실제 anon public key로 바꿔야 해.');
      return false;
    }
    return true;
  }

  async function dbLoad(userId){
    const { data, error } = await supabase.from(TABLE_NAME).select('data,memo').eq('user_id', userId).maybeSingle();
    if (error) throw error;
    return data || null;
  }

  async function dbSave(userId){
    const payload = { user_id: userId, data: state.data, memo: state.memo };
    const { error } = await supabase.from(TABLE_NAME).upsert(payload, { onConflict: 'user_id' });
    if (error) throw error;
  }

  async function scheduleSave(){
    if (!state.ready || !state.user) return;
    if (saveTimer) clearTimeout(saveTimer);
    setSaveStatus('saving', '저장 중...');
    saveTimer = setTimeout(async () => {
      try {
        await dbSave(state.user.id);
        state.saving = 'saved';
        state.saveMessage = '서버 + 로컬에 저장됨';
      } catch (e) {
        state.saving = 'local_only';
        state.saveMessage = '서버 저장 실패 · 로컬 백업만 저장됨';
        state.lastError = 'dbSave: ' + (e && e.message ? e.message : e);
      }
      render();
    }, SAVE_DEBOUNCE_MS);
  }

  async function signInWithGoogle(){
    try {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: REDIRECT_URL }
      });
      if (error) throw error;
    } catch (e) {
      alert('구글 로그인 중 오류가 났어.\n' + (e && e.message ? e.message : e));
    }
  }

  async function signOut(){
    try { await supabase.auth.signOut(); }
    catch(e){}
    location.href = REDIRECT_URL;
  }

  async function initAuth(){
    if (!ensureDeps()) return;
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const backup = getLocalBackup();

    const timeoutId = setTimeout(() => {
      state.bootTimedOut = true;
      if (!state.ready) {
        state.ready = true;
        if (backup) {
          state.data = backup.data || { history:{}, tasks:[] };
          state.memo = backup.memo || {};
          state.saving = 'local_only';
          state.saveMessage = '로컬 백업 복원됨';
        } else {
          state.saving = 'warn';
          state.saveMessage = '초기화 지연';
        }
        render();
      }
    }, 4000);

    try {
      const sessionResult = await supabase.auth.getSession();
      const user = sessionResult?.data?.session?.user || null;
      state.user = user;

      if (user) {
        try {
          const saved = await dbLoad(user.id);
          if (saved) {
            state.data = saved.data || { history:{}, tasks:[] };
            state.memo = saved.memo || {};
            writeLocalBackup('server-sync');
            state.saving = 'saved';
            state.saveMessage = '서버 데이터 불러옴';
          } else if (backup) {
            state.data = backup.data || { history:{}, tasks:[] };
            state.memo = backup.memo || {};
            state.saving = 'local_only';
            state.saveMessage = '로컬 백업 복원됨';
          }
        } catch (e) {
          if (backup) {
            state.data = backup.data || { history:{}, tasks:[] };
            state.memo = backup.memo || {};
            state.saving = 'local_only';
            state.saveMessage = '서버 불러오기 실패 · 로컬 복원';
            state.lastError = 'dbLoad: ' + (e && e.message ? e.message : e);
          } else {
            state.lastError = 'dbLoad: ' + (e && e.message ? e.message : e);
          }
        }
      } else if (backup) {
        state.data = backup.data || { history:{}, tasks:[] };
        state.memo = backup.memo || {};
        state.saving = 'local_only';
        state.saveMessage = '로그인 전 로컬 백업 불러옴';
      }

      const authSub = supabase.auth.onAuthStateChange(async (_event, session) => {
        state.user = session?.user || null;
        if (state.user) {
          try {
            const saved = await dbLoad(state.user.id);
            if (saved) {
              state.data = saved.data || { history:{}, tasks:[] };
              state.memo = saved.memo || {};
              writeLocalBackup('auth-sync');
              state.saving = 'saved';
              state.saveMessage = '서버 데이터 동기화됨';
            }
          } catch (e) {
            state.lastError = 'auth sync: ' + (e && e.message ? e.message : e);
          }
        }
        state.ready = true;
        render();
      });
      window.__authSubscription = authSub?.data?.subscription;
    } catch (e) {
      if (backup) {
        state.data = backup.data || { history:{}, tasks:[] };
        state.memo = backup.memo || {};
        state.saving = 'local_only';
        state.saveMessage = '초기화 실패 · 로컬 복원';
      } else {
        state.lastError = 'initAuth: ' + (e && e.message ? e.message : e);
      }
    } finally {
      clearTimeout(timeoutId);
      state.ready = true;
      render();
    }
  }

  function getMatchStats(dateKey){
    const list = state.data.tasks.filter(t => (t.date || todayKey()) === dateKey && t.matched !== null);
    return { matched: list.filter(t => t.matched === true).length, total: list.length };
  }

  function answerCurrent(value){
    const q = QUESTIONS[state.step];
    const nextAnswers = Object.assign({}, state.answers, {[q.id]: value});
    if (state.step < QUESTIONS.length - 1) {
      patch({ answers: nextAnswers, step: state.step + 1 });
    } else {
      patchData((data) => {
        data.history[todayKey()] = {
          answers: nextAnswers,
          level: calcLevel(nextAnswers),
          time: new Date().toISOString()
        };
      });
      patch({ answers: nextAnswers, view: 'result' });
    }
  }

  function addTask(){
    const input = document.getElementById('newTaskInput');
    const text = (input?.value || '').trim();
    if (!text) return;
    patchData((data) => {
      data.tasks.push({ id: Date.now(), text, urgent:false, matched:null, date:todayKey() });
    });
    if (input) input.value = '';
  }

  function toggleUrgent(id){
    patchData((data) => {
      data.tasks = data.tasks.map(t => t.id === id ? Object.assign({}, t, { urgent: !t.urgent }) : t);
      data.tasks.sort((a,b) => Number(b.urgent) - Number(a.urgent));
    });
  }

  function setMatch(id, matched){
    patchData((data) => {
      data.tasks = data.tasks.map(t => t.id === id ? Object.assign({}, t, { matched: t.matched === matched ? null : matched }) : t);
    });
  }

  function deleteTask(id){
    patchData((data) => {
      data.tasks = data.tasks.filter(t => t.id !== id);
    });
  }

  function setTaskDate(id, date){
    patchData((data) => {
      data.tasks = data.tasks.map(t => t.id === id ? Object.assign({}, t, { date }) : t);
    });
  }

  function updateMemoValue(dateKey, text){
    patchData((_data, memo) => { memo[dateKey] = text; });
  }

  function loginScreen(){
    return h`
      <div class="center-screen loading">
        <div style="width:100%;max-width:360px">
          <div style="text-align:center;margin-bottom:28px">
            <div style="font-size:72px;margin-bottom:10px">⚡</div>
            <div style="font-size:24px;font-weight:900;margin-bottom:6px">에너지 트래커</div>
            <div style="font-size:13px;opacity:.8">나의 에너지를 기록하고 관리해요</div>
          </div>
          <div class="card" style="padding:28px;text-align:center">
            <div style="font-size:15px;font-weight:800;color:#1e293b" class="mb8">시작하기</div>
            <div class="sub mb20">Google 계정으로 로그인하면<br>데이터가 서버와 로컬에 같이 저장돼</div>
            <button class="btn btn-secondary" id="googleLoginBtn" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px">
              <span style="font-size:18px">🔐</span> Google로 로그인
            </button>
            <div style="margin-top:14px">${saveStatusBadge()}</div>
            ${state.lastError ? `<div class="tiny" style="margin-top:10px;color:#fecaca;line-height:1.5">${esc(state.lastError)}</div>` : ''}
          </div>
        </div>
      </div>`;
  }

  function checkScreen(){
    const q = QUESTIONS[state.step];
    const percent = ((state.step + 1) / QUESTIONS.length) * 100;
    const values = Array.from({length: q.max - q.min + 1}, (_,i) => i + q.min);
    return h`
      <div class="screen" style="background:#0f0f1a;color:#fff;padding-top:48px">
        <div class="progress mb24"><div style="width:${percent}%"></div></div>
        <div style="color:#818cf8;font-weight:700;font-size:13px" class="mb8">${state.step + 1} / ${QUESTIONS.length}</div>
        <div style="font-size:52px" class="mb12">${q.emoji}</div>
        <div style="font-size:22px;font-weight:800;line-height:1.4" class="mb24">${esc(q.label)}</div>
        <div class="q-choices mb16">
          ${values.map(v => `<button class="qbtn" data-answer="${v}">${v}</button>`).join('')}
        </div>
        <div class="between" style="color:#64748b;font-size:12px">${q.markers.map(m => `<span>${esc(m)}</span>`).join('')}</div>
        <div class="between" style="margin-top:28px">
          <button class="btn btn-ghost" id="backFromCheck">← 이전</button>
          <div class="tiny" style="color:#334155">질문 ${state.step + 1}</div>
        </div>
      </div>`;
  }

  function resultScreen(){
    const rec = state.data.history[todayKey()];
    const lvl = LEVELS[rec.level];
    return h`
      <div class="center-screen" style="background:linear-gradient(160deg,${lvl.grad[0]}22,${lvl.grad[1]}11)">
        <div style="width:100%;max-width:360px;text-align:center">
          <div style="font-size:72px" class="mb8">${lvl.emoji}</div>
          <div class="sub mb4">오늘의 에너지</div>
          <div style="font-size:40px;font-weight:900;background:linear-gradient(135deg,${lvl.grad[0]},${lvl.grad[1]});-webkit-background-clip:text;-webkit-text-fill-color:transparent" class="mb24">${lvl.level}</div>
          <div class="card" style="padding:20px 24px" class="mb24">
            <div class="sub mb12">추천 활동</div>
            <div class="row gap8" style="flex-wrap:wrap;justify-content:center">
              ${lvl.activities.map(a => `<span class="pill" style="background:${lvl.bg};color:${lvl.tag}">${esc(a)}</span>`).join('')}
            </div>
          </div>
          <div style="height:16px"></div>
          <button class="btn btn-primary" id="goTasksBtn" style="width:100%;margin-bottom:12px">할 일 체크하러 가기 →</button>
          <button class="btn btn-ghost" id="goHomeBtn" style="width:100%">홈으로</button>
        </div>
      </div>`;
  }

  function taskCard(task){
    const isToday = (task.date || todayKey()) === todayKey();
    return h`
      <div class="task">
        <div class="between gap10 mb10">
          <div class="row gap10" style="flex:1;align-items:flex-start">
            <button class="btn-emoji" data-urgent="${task.id}" style="background:none;border:none;font-size:22px;padding:0">${task.urgent ? '⭐' : '⚪'}</button>
            <div style="font-size:14px;line-height:1.5;flex:1">${esc(task.text)}</div>
          </div>
          <button data-del="${task.id}" style="background:none;border:none;color:#cbd5e1;font-size:18px">×</button>
        </div>
        <div class="row gap8 mb10" style="padding-left:32px;flex-wrap:wrap">
          <input type="date" data-date="${task.id}" value="${esc(task.date || todayKey())}" class="badge" style="border:1px solid ${isToday ? '#c7d2fe' : '#e2e8f0'};background:${isToday ? '#eff6ff' : '#f8fafc'};color:${isToday ? '#6366f1' : '#64748b'}">
        </div>
        <div class="row gap8" style="padding-left:32px;flex-wrap:wrap">
          <button data-match-true="${task.id}" class="pill" style="border:1.5px solid ${task.matched===true ? '#3b82f6' : '#e2e8f0'};background:${task.matched===true ? '#eff6ff' : '#f8fafc'};color:${task.matched===true ? '#3b82f6' : '#94a3b8'}">👌 딱좋아</button>
          <button data-match-false="${task.id}" class="pill" style="border:1.5px solid ${task.matched===false ? '#ef4444' : '#e2e8f0'};background:${task.matched===false ? '#fef2f2' : '#f8fafc'};color:${task.matched===false ? '#ef4444' : '#94a3b8'}">🙅 무리야</button>
        </div>
      </div>`;
  }

  function dayDetail(dateKey){
    const rec = state.data.history[dateKey];
    const lvl = rec ? LEVELS[rec.level] : null;
    const stats = getMatchStats(dateKey);
    const mc = stats.total > 0 ? matchColor(stats.matched, stats.total) : null;
    const dayMemo = state.memo[dateKey] || '';
    const dayTasks = state.data.tasks.filter(t => (t.date || todayKey()) === dateKey);
    return h`
      <div class="card" style="padding:16px;border-color:${mc ? mc.dot+'44' : (lvl ? lvl.tag+'33' : '#e2e8f0')};background:${mc ? mc.dot+'11' : (lvl ? lvl.bg : '#fff')}">
        <div class="between mb12">
          <div class="row gap8">
            <div style="font-size:22px">${lvl ? lvl.emoji : '❓'}</div>
            <div>
              <div class="tiny" style="color:#94a3b8">${esc(dateKey)}</div>
              <div style="font-size:14px;font-weight:800;color:${lvl ? lvl.tag : '#94a3b8'}">${lvl ? lvl.level : '기록 없음'}</div>
            </div>
          </div>
          ${mc ? `<span class="pill" style="background:${mc.bg};color:${mc.dot};border:1px solid ${mc.dot}33">${mc.label}</span>` : ''}
        </div>
        <div class="mb10">
          <div class="tiny" style="color:#94a3b8;font-weight:700;margin-bottom:6px">할 일</div>
          ${dayTasks.length ? dayTasks.map(t => `<div class="row gap8" style="background:#fff;border:1px solid #f1f5f9;border-radius:10px;padding:7px 10px;margin-bottom:6px"><span>${t.urgent?'⭐':'⚪'}</span><span style="font-size:13px;flex:1">${esc(t.text)}</span>${t.matched===true?'<span class="tiny" style="color:#3b82f6;font-weight:700">👌 딱좋아</span>':''}${t.matched===false?'<span class="tiny" style="color:#ef4444;font-weight:700">🙅 무리야</span>':''}</div>`).join('') : '<div class="small" style="color:#cbd5e1">할 일 없음</div>'}
        </div>
        ${dayMemo ? `<div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px 12px;font-size:13px;color:#475569;line-height:1.6">📝 ${esc(dayMemo)}</div>` : '<div class="small" style="color:#cbd5e1">메모 없음</div>'}
      </div>`;
  }

  function monthCalendar(){
    const year = state.selectedMonth.year;
    const month = state.selectedMonth.month;
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const cells = [];
    for (let i=0;i<firstDay;i++) cells.push(null);
    for (let d=1;d<=daysInMonth;d++) cells.push(d);

    function keyOf(d){ return `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

    return h`
      <div>
        <div class="between mb16">
          <button class="btn btn-ghost" id="prevMonthBtn">‹</button>
          <div style="font-weight:800">${year}년 ${month+1}월</div>
          <button class="btn btn-ghost" id="nextMonthBtn">›</button>
        </div>
        <div class="calendar mb8">
          ${["일","월","화","수","목","금","토"].map(d => `<div class="tiny" style="text-align:center;color:#94a3b8;font-weight:700;padding:4px 0">${d}</div>`).join('')}
        </div>
        <div class="calendar">
          ${cells.map((d) => {
            if (!d) return '<div></div>';
            const k = keyOf(d);
            const rec = state.data.history[k];
            const l = rec ? LEVELS[rec.level] : null;
            const stats = getMatchStats(k);
            const mc = stats.total > 0 ? matchColor(stats.matched, stats.total) : null;
            const isToday = k === todayKey();
            const isSel = state.selectedDay === d;
            return `<button class="daybtn" data-select-day="${d}" style="border-color:${isSel ? '#6366f1' : isToday ? '#c7d2fe' : mc ? mc.dot+'55' : 'transparent'};background:${mc ? mc.dot+'33' : l ? `linear-gradient(135deg,${l.grad[0]}22,${l.grad[1]}11)` : '#f8fafc'}"><div class="tiny" style="font-weight:${isToday?800:500};color:${isToday?'#6366f1':'#334155'}">${d}</div>${l ? `<div>${l.emoji}</div>` : ''}</button>`;
          }).join('')}
        </div>
        ${state.selectedDay ? `<div style="margin-top:12px">${dayDetail(keyOf(state.selectedDay))}</div>` : ''}
      </div>`;
  }

  function mainScreen(){
    const today = todayKey();
    const todayRec = state.data.history[today];
    const lvl = todayRec ? LEVELS[todayRec.level] : null;
    const todayStats = getMatchStats(today);
    const todayMC = matchColor(todayStats.matched, todayStats.total);
    const histKeys = Object.keys(state.data.history).sort().reverse();

    return h`
      <div class="screen">
        ${state.tab === 'home' ? h`
          <div class="title mb4">⚡ 에너지 트래커</div>
          <div class="between mb20">
            <div class="sub">${today}</div>
            <button class="btn btn-ghost" id="logoutBtn" style="padding:6px 12px;border-radius:999px">로그아웃</button>
          </div>

          <div class="between mb16" style="flex-wrap:wrap;gap:8px">
            ${saveStatusBadge()}
            ${state.user ? `<span class="badge">${esc(state.user.email || '로그인됨')}</span>` : ''}
          </div>

          <div class="card hero mb16">
            ${lvl ? h`
              <div style="font-size:48px" class="mb4">${lvl.emoji}</div>
              <div style="font-size:13px;opacity:.85">오늘의 에너지</div>
              <div style="font-size:36px;font-weight:900">${lvl.level}</div>
              <div class="row gap8" style="flex-wrap:wrap;margin-top:12px">
                ${lvl.activities.map(a => `<span class="pill" style="background:#ffffff33;color:#fff">${esc(a)}</span>`).join('')}
              </div>
              <button class="btn" id="recheckBtn" style="margin-top:16px;background:#ffffff33;color:#fff;border-radius:999px">다시 체크</button>
            ` : h`
              <div style="text-align:center;padding:8px 0">
                <div style="font-size:48px" class="mb8">🔍</div>
                <div style="font-size:16px;font-weight:700" class="mb16">오늘 에너지 체크 안 했어</div>
                <button class="btn btn-secondary" id="startCheckBtn" style="color:#6366f1;border:none">지금 체크하기 →</button>
              </div>
            `}
          </div>

          ${todayMC ? `<div class="card mb16" style="padding:12px 18px;background:${todayMC.bg};border-color:${todayMC.dot}33"><div class="between gap12"><div style="font-size:13px;color:#475569">오늘 할 일 <b>${todayStats.total}개</b> 중 <b>${todayStats.matched}개</b>가 에너지에 맞아</div><div style="font-weight:800;color:${todayMC.dot};font-size:13px">${todayMC.label}</div></div></div>` : ''}

          <div class="card" style="padding:18px" class="mb16">
            <div class="between mb12">
              <div style="font-size:15px;font-weight:700">할 일 ${state.data.tasks.length ? `<span style="color:#6366f1">${state.data.tasks.length}</span>` : ''}</div>
              <button class="btn" data-tab="tasks" style="background:none;color:#6366f1;padding:0">전체보기 →</button>
            </div>
            ${state.data.tasks.length ? state.data.tasks.slice(0,3).map(t => `<div class="between gap8" style="padding:8px 0;border-bottom:1px solid #f1f5f9"><span>${t.urgent?'⭐':'⚪'}</span><span style="font-size:14px;color:#334155;flex:1">${esc(t.text)}</span>${t.matched===true?'<span class="small" style="color:#3b82f6;font-weight:700">👌 딱좋아</span>':''}${t.matched===false?'<span class="small" style="color:#ef4444;font-weight:700">🙅 무리야</span>':''}</div>`).join('') : '<div style="color:#cbd5e1;font-size:13px;text-align:center;padding:12px 0">할 일을 추가해봐</div>'}
          </div>

          <div style="height:16px"></div>
          <div class="card" style="padding:18px">
            <div style="font-size:15px;font-weight:700" class="mb10">📝 오늘의 메모</div>
            <textarea class="textarea" id="todayMemoInput" placeholder="오늘 하루 짧게 기록해봐">${esc(state.memo[today] || '')}</textarea>
          </div>

          ${state.lastError ? `<div style="margin-top:16px" class="small"><div class="status err">${esc(state.lastError)}</div></div>` : ''}
        ` : ''}

        ${state.tab === 'tasks' ? h`
          <div style="font-size:20px;font-weight:800" class="mb20">📋 할 일</div>
          <div class="row gap8 mb20">
            <input id="newTaskInput" class="input" placeholder="할 일 추가...">
            <button class="btn btn-primary" id="addTaskBtn" style="padding:12px 18px;font-size:20px">+</button>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px">
            ${state.data.tasks.length ? state.data.tasks.map(taskCard).join('') : '<div style="color:#cbd5e1;text-align:center;margin-top:32px">아직 할 일이 없어</div>'}
          </div>
        ` : ''}

        ${state.tab === 'history' ? h`
          <div style="font-size:20px;font-weight:800" class="mb20">📅 기록</div>
          <div class="row gap8 mb20">
            <button class="btn ${state.historyTab==='weekly'?'btn-primary':'btn-ghost'}" id="histWeeklyBtn" style="flex:1">최근 7일</button>
            <button class="btn ${state.historyTab==='monthly'?'btn-primary':'btn-ghost'}" id="histMonthlyBtn" style="flex:1">월별</button>
          </div>
          ${state.historyTab === 'weekly' ? (
            histKeys.slice(0,7).length ? histKeys.slice(0,7).map(k => {
              const rec = state.data.history[k];
              const l = LEVELS[rec.level];
              const stats = getMatchStats(k);
              const mc = stats.total>0 ? matchColor(stats.matched, stats.total) : null;
              const open = state.selectedDay === k;
              return `<div style="margin-bottom:10px">
                <button class="card" data-week-open="${esc(k)}" style="width:100%;padding:14px 18px;display:flex;align-items:center;gap:12px;text-align:left;background:${mc?mc.dot+'22':'#fff'};border-color:${mc?mc.dot+'44':'transparent'}">
                  <span style="font-size:20px">${l.emoji}</span>
                  <div style="flex:1"><div class="small" style="color:#94a3b8">${k}</div><div style="font-weight:800;background:linear-gradient(135deg,${l.grad[0]},${l.grad[1]});-webkit-background-clip:text;-webkit-text-fill-color:transparent">${l.level}</div></div>
                  ${mc?`<span class="pill" style="background:${mc.bg};color:${mc.dot}">${mc.label}</span>`:''}
                  <span class="small" style="color:#94a3b8">${open?'▲':'▼'}</span>
                </button>
                ${open ? `<div style="margin-top:8px">${dayDetail(k)}</div>` : ''}
              </div>`;
            }).join('') : '<div style="color:#94a3b8;text-align:center;margin-top:48px">기록이 없어</div>'
          ) : monthCalendar()}
        ` : ''}
      </div>

      <nav class="nav">
        ${[['home','🏠','홈'],['tasks','📋','할 일'],['history','📅','기록']].map(([id,emoji,label]) => `
          <button class="${state.tab===id?'active':''}" data-tab="${id}">
            <span style="font-size:22px">${emoji}</span>
            <span style="font-size:11px">${label}</span>
            ${state.tab===id?'<div style="width:4px;height:4px;border-radius:50%;background:#6366f1"></div>':''}
          </button>
        `).join('')}
      </nav>
    `;
  }

  function render(){
    if (!state.ready) {
      app.className = 'center-screen loading';
      app.innerHTML = `<div style="font-size:48px">⚡</div><div style="font-size:14px;font-weight:700">불러오는 중...</div><div style="font-size:12px;opacity:.85">${esc(state.saveMessage || '초기화 중')}</div>`;
      return;
    }
    if (!state.user) {
      app.className = '';
      app.innerHTML = loginScreen();
      bind();
      return;
    }
    app.className = '';
    app.innerHTML = state.view === 'check' ? checkScreen() : state.view === 'result' ? resultScreen() : mainScreen();
    bind();
  }

  function bind(){
    const on = (sel, ev, fn) => {
      document.querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn));
    };

    const loginBtn = document.getElementById('googleLoginBtn');
    if (loginBtn) loginBtn.onclick = signInWithGoogle;

    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) logoutBtn.onclick = signOut;

    const startCheckBtn = document.getElementById('startCheckBtn');
    if (startCheckBtn) startCheckBtn.onclick = () => patch({ view:'check', step:0, answers:{} });

    const recheckBtn = document.getElementById('recheckBtn');
    if (recheckBtn) recheckBtn.onclick = () => patch({ view:'check', step:0, answers:{} });

    const backFromCheck = document.getElementById('backFromCheck');
    if (backFromCheck) backFromCheck.onclick = () => state.step > 0 ? patch({ step: state.step - 1 }) : patch({ view:'main' });

    on('[data-answer]', 'click', (e) => answerCurrent(Number(e.currentTarget.getAttribute('data-answer'))));

    const goTasksBtn = document.getElementById('goTasksBtn');
    if (goTasksBtn) goTasksBtn.onclick = () => patch({ view:'main', tab:'tasks' });

    const goHomeBtn = document.getElementById('goHomeBtn');
    if (goHomeBtn) goHomeBtn.onclick = () => patch({ view:'main', tab:'home' });

    on('[data-tab]', 'click', (e) => patch({ tab: e.currentTarget.getAttribute('data-tab'), view: 'main' }));

    const addTaskBtn = document.getElementById('addTaskBtn');
    if (addTaskBtn) addTaskBtn.onclick = addTask;

    const newTaskInput = document.getElementById('newTaskInput');
    if (newTaskInput) newTaskInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });

    on('[data-urgent]', 'click', (e) => toggleUrgent(Number(e.currentTarget.getAttribute('data-urgent'))));
    on('[data-del]', 'click', (e) => deleteTask(Number(e.currentTarget.getAttribute('data-del'))));
    on('[data-match-true]', 'click', (e) => setMatch(Number(e.currentTarget.getAttribute('data-match-true')), true));
    on('[data-match-false]', 'click', (e) => setMatch(Number(e.currentTarget.getAttribute('data-match-false')), false));
    on('[data-date]', 'change', (e) => setTaskDate(Number(e.currentTarget.getAttribute('data-date')), e.currentTarget.value));

    const memoInput = document.getElementById('todayMemoInput');
    if (memoInput) memoInput.addEventListener('input', (e) => updateMemoValue(todayKey(), e.currentTarget.value));

    const weeklyBtn = document.getElementById('histWeeklyBtn');
    if (weeklyBtn) weeklyBtn.onclick = () => patch({ historyTab:'weekly', selectedDay:null });

    const monthlyBtn = document.getElementById('histMonthlyBtn');
    if (monthlyBtn) monthlyBtn.onclick = () => patch({ historyTab:'monthly', selectedDay:null });

    on('[data-week-open]', 'click', (e) => {
      const key = e.currentTarget.getAttribute('data-week-open');
      patch({ selectedDay: state.selectedDay === key ? null : key });
    });

    on('[data-select-day]', 'click', (e) => {
      const d = Number(e.currentTarget.getAttribute('data-select-day'));
      patch({ selectedDay: state.selectedDay === d ? null : d });
    });

    const prevMonthBtn = document.getElementById('prevMonthBtn');
    if (prevMonthBtn) prevMonthBtn.onclick = () => {
      const {year, month} = state.selectedMonth;
      patch({ selectedMonth: month === 0 ? {year: year - 1, month: 11} : {year, month: month - 1}, selectedDay:null });
    };

    const nextMonthBtn = document.getElementById('nextMonthBtn');
    if (nextMonthBtn) nextMonthBtn.onclick = () => {
      const {year, month} = state.selectedMonth;
      patch({ selectedMonth: month === 11 ? {year: year + 1, month: 0} : {year, month: month + 1}, selectedDay:null });
    };
  }

  initAuth();
})();
</script>
</body>
</html>
